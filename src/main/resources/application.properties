spring.application.name=yaku-backend

# Stripe Configuration
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success.url=${STRIPE_SUCCESS_URL:http://localhost:3000/payment-success}
stripe.cancel.url=${STRIPE_CANCEL_URL:http://localhost:3000/payment-cancel}

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/yaku_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
debug=false

# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration Properties
authorization.jwt.secret=${JWT_SECRET:WriteHereYourSecretStringForTokenSigningCredentialsAtLeast256Bits}
authorization.jwt.expiration.days=7

# CORS Configuration
spring.graphql.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,https://front-opensource.web.app}
spring.graphql.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.graphql.cors.allowed-headers=Origin,Accept,X-Requested-With,Content-Type,Authorization,Access-Control-Request-Method,Access-Control-Request-Headers
spring.graphql.cors.allow-credentials=true

# Firebase Admin SDK Configuration
app.firebase.config-path=${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}

# MQTT - habilitar si hay broker disponible
mqtt.enabled=${MQTT_ENABLED:false}

# Swagger - resolver URLs correctamente detras de proxy inverso
server.forward-headers-strategy=framework
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs